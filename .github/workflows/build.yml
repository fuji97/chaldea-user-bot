name: Build Application

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json
    - name: Install dependencies
      run: dotnet restore ChaldeaBot.sln
    - name: Build
      run: dotnet build --configuration Release --no-restore ChaldeaBot.sln
    - name: Test
      run: dotnet test ChaldeaBot.sln --configuration Release --no-build --filter "TestCategory!=LiveIntegration"

  image:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Image metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=beta,enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch,enable=${{ github.ref_name != 'master' }}
          type=sha,prefix=sha-,format=short
    - name: Build and push
      id: push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: src
        file: src/Server/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Summary
      run: |
        echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
        echo "tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
        echo "digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
