# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# Kestrel here serves plain HTTP; a reverse proxy in front of this service must terminate TLS
# before forwarding webhook traffic to it.
services:
  chaldeabot:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MODE=webhook
      - BaseUrl=${BASE_URL:?BASE_URL is required}
      - WebhookSecret=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
