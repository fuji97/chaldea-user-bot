# Host-wide updater. Only containers labelled com.centurylinklabs.watchtower.enable=true
# are replaced (the two bot containers), so the pinned Postgres containers never move.
name: watchtower

services:
  watchtower:
    image: containrrr/watchtower:1.7.1@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    restart: always
    command: --label-enable --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
